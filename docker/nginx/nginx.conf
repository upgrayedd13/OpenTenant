server {
    listen 80;
    listen [::]:80;
    server_name lpmtu.com;

    # Certbot HTTP-01 challenge must remain available over HTTP
    location /.well-known/ {
        root /var/www/certbot/;
    }
    
    location /mail/config-v1.1.xml {
        alias /var/www/certbot/.well-known/autoconfig/mail/config-v1.1.xml;
        default_type application/xml;
    }
    
    # Everything else redirects to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lpmtu.com;

    ssl_certificate /etc/letsencrypt/live/lpmtu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lpmtu.com/privkey.pem;

    location /.well-known/ {
        root /var/www/certbot/;
    }

    location /mail/config-v1.1.xml {
        alias /var/www/certbot/.well-known/autoconfig/mail/config-v1.1.xml;
        default_type application/xml;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.lpmtu.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mail.lpmtu.com;

    ssl_certificate /etc/letsencrypt/live/mail.lpmtu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.lpmtu.com/privkey.pem;

    location / {
        proxy_pass https://nginx-mailcow:8443;

        proxy_ssl_server_name on;
        proxy_ssl_name mail.lpmtu.com;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
