server {
    listen 80;
    server_name lpmtu.com;

    # Certbot HTTP-01 challenge must remain available over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lpmtu.com;

    ssl_certificate /etc/letsencrypt/live/lpmtu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lpmtu.com/privkey.pem;

    location /static/ {
        alias /app/src/OpenTenant_app/static/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
