<div class="calendar-header">
    <button id="prev" class="cal-nav-btn" aria-label="Previous month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
    </button>

    <button id="monthLabel" class="month-label-btn" aria-haspopup="true" aria-expanded="false">
        <span id="monthLabelText"></span>
        <span class="month-label-caret" aria-hidden="true">▼</span>
    </button>

    <button id="next" class="cal-nav-btn" aria-label="Next month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <polyline points="9 18 15 12 9 6"/>
        </svg>
    </button>

    <div id="monthPicker" class="month-picker" hidden>
        <div class="month-picker-header">
            <div class="month-picker-year">
                <button id="yearPrev" class="year-step-btn" aria-label="Previous year">&#8249;</button>
                <input id="yearInput" class="year-input" type="number" min="1900" max="2100">
                <button id="yearNext" class="year-step-btn" aria-label="Next year">&#8250;</button>
            </div>
            <button id="pickerClose" class="picker-close-btn" aria-label="Close picker">&times;</button>
        </div>
        <div class="month-picker-grid" id="monthPickerGrid"></div>
    </div>
</div>

<div class="calendar-grid" id="calendar"></div>

<div id="eventModal" class="event-modal" hidden>
    <div class="event-modal-content">
        <button id="eventModalClose" class="event-modal-close-btn" aria-label="Close">&times;</button>
        <h3 id="eventModalTitle" class="event-modal-title"></h3>
        <div id="eventModalBody" class="event-modal-body"></div>
    </div>
</div>
