{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}

<main class="register-main">
    <div class="register-box">

        <button type="button" class="uploadLease-btn" id="uploadLeaseBtn">
            Upload Lease
        </button>
        <input type="file" id="leasePdfInput" name="lease_pdf" accept="application/pdf" hidden>

        <form method="POST" enctype="multipart/form-data">
            {{ form.hidden_tag() }}

            {% include "account/forms/_signup_form.html" %}

            <button class="submit-btn">Submit</button>
        </form>
    </div>
</main>

<!-- JS files -->
<script src="{{ url_for('account.static', filename='js/upload.js') }}"></script>

{% endblock %}
