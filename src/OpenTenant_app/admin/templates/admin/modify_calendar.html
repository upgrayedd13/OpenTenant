{% extends "base.html" %}


{% block title %}
Modify Calendar
{% endblock %}


{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('about.static', filename='css/calendar.css') }}">
<link rel="stylesheet" href="{{ url_for('admin.static', filename='css/admin_calendar.css') }}">
{% endblock %}


{% block content %}

<main class="admin-main">
    <section class="admin-calendar-pane">
        {% include "about/calendar_content.html" %}
    </section>

    <aside class="admin-event-pane" id="eventPane">
        <div class="event-pane-inner">
            <div class="event-pane-header">
                <span id="eventPaneDate"></span>
                <button id="eventPaneClose" aria-label="Close panel">&times;</button>
            </div>

            <form id="eventForm" class="event-form">
                <label for="eventTitle">Title</label>
                <input type="text" id="eventTitle" placeholder="e.g. Team standup" required>
                <label for="eventTime">Time</label>
                <input type="time" id="eventTime">
                <label for="eventDesc">Description</label>
                <textarea id="eventDesc" rows="3" placeholder="Optional notes..."></textarea>
                <button type="submit" class="event-submit">Add Event</button>
            </form>
        </div>
    </aside>
</main>

<script type="module" src="{{ url_for('about.static', filename='js/admin_calendar.js') }}"></script>

{% endblock %}
