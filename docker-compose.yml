name: OpenTenant

services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: opentenant_app
        restart: unless-stopped
        environment:
            ENV: production
            PYTHONPATH: /app/src
            LOAD_DOTENV: "0"
        env_file:
            - .env.production
        volumes:
            - ./instance:/app/instance
            - ./data/tmp:/tmp/OpenTenant
            - ./data/leases:/tmp/leases
            - ./data/files:/tmp/files
        expose:
            - "8000"
        depends_on:
            - db
            - scheduler

    scheduler:
        build:
            context: .
            dockerfile: docker/scheduler/Dockerfile
        container_name: opentenant_scheduler
        command: uv run python -m src.OpenTenant_app.scheduler.runner
        depends_on:
            - db
        restart: unless-stopped
        env_file:
            - .env.production

    nginx:
        image: nginx:1.25-alpine
        container_name: opentenant_nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt
            - ./src:/app/src:ro
        depends_on:
            - app

    certbot:
        image: certbot/certbot
        container_name: opentenant_certbot
        restart: unless-stopped
        volumes:
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt
        entrypoint: >
            sh -c "trap exit TERM;
                while :; do
                    certbot renew --webroot -w /var/www/certbot;
                    sleep 12h;
                done"

    db:
        image: postgres:16
        container_name: opentenant_db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
        expose:
            - "5432"

volumes:
    pgdata: