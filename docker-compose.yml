name: OpenTenant

services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: opentenant_app
        restart: unless-stopped
        environment:
            ENV: production
            PYTHONPATH: /app/src
            LOAD_DOTENV: "0"
        env_file:
            - .env.production
        volumes:
            - ./instance:/app/instance
            - ./data/tmp:/tmp/OpenTenant
            - ./data/leases:/tmp/leases
            - ./data/files:/tmp/files
        expose:
            - "8000"
        depends_on:
            db:
                condition: service_healthy
            #scheduler:

    scheduler:
        build:
            context: .
            dockerfile: docker/scheduler/Dockerfile
        container_name: opentenant_scheduler
        command: uv run python -m src.OpenTenant_app.scheduler.runner
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
        env_file:
            - .env.production

    nginx:
        image: nginx:1.25-alpine
        container_name: opentenant_nginx
        restart: unless-stopped
        entrypoint: >
            sh -c "while :; do
                sleep 6h;
                nginx -s reload;
            done & nginx -g 'daemon off;'"
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt
            - ./src:/app/src:ro
        depends_on:
            - app
        healthcheck:
            test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && test -f /var/run/nginx.pid && kill -0 $(cat /var/run/nginx.pid)"]
            interval: 30s
            timeout: 5s
            retries: 3

    certbot:
        image: certbot/certbot
        container_name: opentenant_certbot
        restart: unless-stopped
        volumes:
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt
            - /var/run/docker.sock:/var/run/docker.sock
        entrypoint: >
            sh -c "trap exit TERM;
                while :; do
                    certbot renew --webroot -w /var/www/certbot;
                    sleep 12h;
                done"
        healthcheck:
            test: ["CMD-SHELL", "certbot certificates 2>/dev/null | grep -q VALID && ps aux | grep -q '[s]leep 12h'"]
            interval: 1h
            timeout: 10s
            retries: 3
            start_period: 30s

    db:
        image: postgres:16
        container_name: opentenant_db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
        expose:
            - "5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    pgdata:
