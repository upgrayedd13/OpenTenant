name: OpenTenant

services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: opentenant_app
        restart: unless-stopped
        env_file:
            - ${COMPOSE_ENV_FILE}
        environment:
            PYTHONPATH: /app/src
            LOAD_DOTENV: "0"
        volumes:
            - ./docker/app/data/tmp:/tmp/OpenTenant
            - ./docker/app/data/leases:/app/leases
            - ./docker/app/data/files:/app/files
        expose:
            - "8000"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        depends_on:
            db:
                condition: service_healthy

    scheduler:
        build:
            context: .
            dockerfile: docker/scheduler/Dockerfile
        container_name: opentenant_scheduler
        command: uv run python -m src.OpenTenant_app.scheduler.runner
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
        env_file:
            - ${COMPOSE_ENV_FILE}
        healthcheck:
            test: ["CMD-SHELL", "test -f /tmp/scheduler-health && test $$(($$(date +%s) - $$(stat -c %Y /tmp/scheduler-health))) -lt 120 && test $(cat /tmp/scheduler-health) -eq 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    nginx:
        image: nginx:1.25-alpine
        container_name: opentenant_nginx
        profiles: ["production"]
        restart: unless-stopped
        entrypoint: >
            sh -c "while :; do
                sleep 6h;
                nginx -s reload;
            done & nginx -g 'daemon off;'"
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/certbot/www:/var/www/certbot
            - ./docker/certbot/conf:/etc/letsencrypt
        depends_on:
            - app
        healthcheck:
            test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && test -f /var/run/nginx.pid && kill -0 $(cat /var/run/nginx.pid)"]
            interval: 30s
            timeout: 5s
            retries: 3

    certbot:
        image: certbot/certbot
        container_name: opentenant_certbot
        profiles: ["production"]
        restart: unless-stopped
        volumes:
            - ./docker/certbot/www:/var/www/certbot
            - ./docker/certbot/conf:/etc/letsencrypt
            - /var/run/docker.sock:/var/run/docker.sock
        entrypoint: >
            sh -c "trap exit TERM;
                while :; do
                    certbot renew --webroot -w /var/www/certbot;
                    sleep 12h;
                done"
        healthcheck:
            test: ["CMD-SHELL", "certbot certificates 2>/dev/null | grep -q VALID && ps aux | grep -q '[s]leep 12h'"]
            interval: 1h
            timeout: 10s
            retries: 3
            start_period: 30s

    db:
        image: postgres:16
        container_name: opentenant_db
        restart: unless-stopped
        env_file:
            - ${COMPOSE_ENV_FILE}
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
        expose:
            - "5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    pgdata:
