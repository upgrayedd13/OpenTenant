name: OpenTenant

services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: opentenant_app
        restart: unless-stopped
        env_file:
            - .env
        environment:
            ENV: production
            PYTHONPATH: /app/src
            LOAD_DOTENV: "0"
        volumes:
            - ./instance:/app/instance
            - ./data/tmp:/tmp/OpenTenant
            - ./data/leases:/tmp/leases
            - ./data/files:/tmp/files
        expose:
            - "8000"
        depends_on:
            - db
            # - scheduler

    # scheduler:
