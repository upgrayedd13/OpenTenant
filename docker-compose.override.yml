services:
    app:
        environment:
            ENV: development
            FLASK_DEBUG: 1
        env_file:
            - .env.development
        ports:
            - "8000:8000"

    scheduler:
        env_file:
            - .env.development

    db:
        ports:
            - "5432:5432"

    nginx:
        ports: []
        restart: "no"

    certbot:
        restart: "no"